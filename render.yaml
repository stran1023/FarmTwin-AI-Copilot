services:
  - type: web
    name: farmtwin-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.2
      - key: SNOWFLAKE_ACCOUNT
        sync: false
      - key: SNOWFLAKE_USER
        sync: false
      - key: SNOWFLAKE_ROLE
        sync: false
      - key: SNOWFLAKE_WAREHOUSE
        sync: false
      - key: SNOWFLAKE_DATABASE
        sync: false
      - key: SNOWFLAKE_SCHEMA
        sync: false
      - key: SNOWFLAKE_PAT
        sync: false
      - key: OPEN_METEO_BASE_URL
        value: https://api.open-meteo.com/v1
      - key: DEMO_PASSCODE
        sync: false
      - key: FRONTEND_URL
        value: http://localhost:3000 # placeholder -- set to the real Vercel URL once deployed (see docs/architecture.md deploy notes)
